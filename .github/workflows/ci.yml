# CI: every derived artifact must match its source, and the suite must pass.
# The upstream check runs weekly rather than on every push: it reaches the
# network, and its failure is a maintenance signal, not a regression.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Node 24: the version this package is tested on (`package.json#engines`).
      # CI pins the newest line rather than the floor so a regression in the
      # current release shows up here first.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # No dependencies to install. The plugin imports nothing outside Node's
      # built-ins -- `@deepseek-ai/dsh-skill` is a peer the host provides -- and
      # the suite drives the plugin through a stub registry, so a bare checkout
      # is enough to verify a release candidate.

      - name: Derived artifacts match artifacts.json
        run: node scripts/generate-artifacts.mjs --check

      - name: Vendored tree matches upstream plus adaptations
        run: node tests/test-plugin.mjs

      - name: Packing self-check
        run: npm pack --dry-run

  upstream:
    # Informational: tells the maintainer upstream moved. Not a merge gate.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Has upstream moved?
        run: node scripts/check-upstream.mjs
